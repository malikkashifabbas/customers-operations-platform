<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f3483" />
    <meta name="description" content="OpsPilot customer support assistant" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OpsPilot</title>
    <script>
      // Before React loads, so a dark-mode visitor never sees a white flash.
      try {
        const saved = localStorage.getItem('opspilot-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
