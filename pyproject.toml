[project]
name = "opspilot"
version = "0.1.0"
description = "Event-driven multi-agent customer operations platform (Django + LangGraph + Kafka)"
readme = "README.md"
authors = [
    { name = "Malik Kashif Abbas", email = "malikkashifabbas28@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "django>=5.2,<6.0",
    "django-ninja>=1.4,<2",
    "email-validator>=2.2",
    "fastembed>=0.7,<0.8",
    "langchain>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langfuse>=3,<4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-redis>=0.5,<0.6",
    "pgvector>=0.4,<0.5",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5,<7",
]
